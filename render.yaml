services:
  # 1. Node.js Express Backend API
  - type: web
    name: canteenx-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: canteenx-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_MOCK_MODE
        value: "true"
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: canteenx-ai-service
          property: host

  # 2. Python FastAPI AI Service
  - type: web
    name: canteenx-ai-service
    runtime: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

databases:
  # 3. Managed PostgreSQL Database (Free Tier)
  - name: canteenx-db
    databaseName: canteenx_db
    user: canteenx
    plan: free
