version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: canteenx_postgres
    restart: always
    environment:
      POSTGRES_USER: canteenx
      POSTGRES_PASSWORD: canteenx_secure_pass
      POSTGRES_DB: canteenx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: canteenx_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_TYPE=postgres
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=canteenx
      - PGPASSWORD=canteenx_secure_pass
      - PGDATABASE=canteenx_db
      - JWT_SECRET=super_secret_canteenx_jwt_key_2026
      - AI_SERVICE_URL=http://ai-service:8000
      - RAZORPAY_MOCK_MODE=true
    depends_on:
      - postgres

  ai-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ai
    container_name: canteenx_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_TYPE=postgres
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=canteenx
      - PGPASSWORD=canteenx_secure_pass
      - PGDATABASE=canteenx_db
    depends_on:
      - postgres

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: canteenx_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
